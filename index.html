<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!--
      多層防御の最後の層（設計書 §11）。
      HTML プレビューは Blob URL の sandbox iframe。data: は代替表示用。
      埋め込み画像は ObjectURL なので img-src に blob: が要る。

      img-src / media-src に https: を入れているのは、利用者が HTML に書いた
      外部画像を表示するため（設計書 §11 の「ユーザーが明示的に埋め込んだ画像URL等を除く」）。
      プレビューは親の CSP を継承し、ここを閉じると画像が全部消える。
      スクリプトと通信（script-src / connect-src）は閉じたままなので、
      万一 XSS を踏んでも外部へ送る手段は残らない。

      開発サーバでは vite.config.ts が緩めた内容へ差し替える。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' blob: data: https:; media-src 'self' blob: data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; frame-src blob: data:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>Shiorbit</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
